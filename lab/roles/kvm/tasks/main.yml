---
# tasks file for kvm
# tasks/main.yml
#
# This is the main task file for the KVM provisioning role.
# It orchestrates the entire process of setting up the host
# and creating the virtual machines.
#
- name: "Update apt cache and install KVM-related packages"
  become: true
  ansible.builtin.apt:
    name:
      - qemu-kvm
      - libvirt-daemon-system
      - libvirt-clients
      - bridge-utils
      - virtinst
      - libosinfo-bin
      - python3-libvirt
      - genisoimage

    state: present
    update_cache: true
  tags: [kvm_host_setup]

- name: "Ensure libvirtd service is started and enabled"
  become: true
  ansible.builtin.service:
    name: libvirtd
    state: started
    enabled: true
  tags: [kvm_host_setup]

- name: "Create directory for VM images"
  become: true
  ansible.builtin.file:
    path: "{{ vm_image_dir }}"
    state: directory
    owner: "root"
    group: "root"
    mode: '0755'
  tags: [kvm_host_setup]

- name: "Download Ubuntu 22.04 Cloud Image if it doesn't exist"
  become: true
  ansible.builtin.get_url:
    url: "{{ vm_base_image_url }}"
    dest: "{{ vm_image_dir }}/{{ vm_base_image_name }}"
    mode: '0644'
  register: download_result
  until: download_result is succeeded
  retries: 5
  delay: 2
  tags: [kvm_host_setup]

- name: "Loop through the list of VMs to create"
  ansible.builtin.include_tasks: "create-vm.yml"
  loop: "{{ vms }}"
  loop_control:
    loop_var: vm
  tags: [always]

