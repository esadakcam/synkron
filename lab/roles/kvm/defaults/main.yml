---
# defaults file for kvm
vm_image_dir: "/var/lib/libvirt/images"
vm_base_image_url: "https://cloud-images.ubuntu.com/jammy/current/jammy-server-cloudimg-amd64.img"
vm_base_image_name: "jammy-server-cloudimg-amd64.img"
os_variant: "ubuntu22.04"

# Default VM specifications
default_memory: "2048"  # in MB
default_vcpus: "2"
default_disk_size: "20G"

# User configuration
vm_user: "ansible"
vm_password: "Password123!" # You can login with this password via console
vm_ssh_key: "ssh-rsa  esad@pop-os"

vms:
  # - name: "ubuntu-vm-01"
  #   memory: "4096"
  #   vcpus: "4"
  #   disk_size: "40G"
  - name: "vm"
