---
- name: Create a KVM Virtual Machine
  hosts: hypervisors
  # This playbook should be run by the user added to the libvirt/kvm groups
  # 'become: yes' is not needed if the user has the correct permissions
  vars:
    vm_name: "ubuntu-webserver-02"
    vm_disk_path: "/var/lib/libvirt/images"
    # Download the latest Ubuntu 22.04 cloud image from:
    # https://cloud-images.ubuntu.com/jammy/current/jammy-server-cloudimg-amd64.img
    base_image_path: "/tmp/jammy-server-cloudimg-amd64.img"
    vm_disk_size: "20G"
    vm_memory: "2097152"
    vm_vcpu: "2"

  tasks:
    - name: Ensure the image directory exists
      become: yes
      ansible.builtin.file:
        path: "{{ vm_disk_path }}"
        state: directory
        owner: libvirt-qemu
        group: kvm
        mode: '0775'

    - name: Check if base cloud image already exists
      ansible.builtin.stat:
        path: "{{ base_image_path }}"
      register: base_image_stat

    - name: Download Ubuntu 22.04 cloud image
      ansible.builtin.get_url:
        url: "https://cloud-images.ubuntu.com/jammy/current/jammy-server-cloudimg-amd64.img"
        dest: "{{ base_image_path }}"
        mode: '0644'
        timeout: 300
      register: download_result
      when: not base_image_stat.stat.exists

    - name: Create a new disk from the base cloud image
      become: yes
      ansible.builtin.command:
        cmd: "cp {{ base_image_path }} {{ vm_disk_path }}/{{ vm_name }}.qcow2"
        creates: "{{ vm_disk_path }}/{{ vm_name }}.qcow2"
      when: base_image_stat.stat.exists or (download_result is succeeded)
      
    - name: Resize the new VM disk
      become: yes
      ansible.builtin.command:
        cmd: "qemu-img resize {{ vm_disk_path }}/{{ vm_name }}.qcow2 {{ vm_disk_size }}"
      when: base_image_stat.stat.exists or (download_result is succeeded)
      
    - name: Define and start the virtual machine
      community.libvirt.virt:
        command: define
        xml: "{{ lookup('template', 'vm-template.xml.j2') }}"
      register: vm_define
      when: base_image_stat.stat.exists or (download_result is succeeded)

    - name: Start the virtual machine
      community.libvirt.virt:
        name: "{{ vm_name }}"
        state: running
      when: vm_define.changed and (base_image_stat.stat.exists or (download_result is succeeded))

